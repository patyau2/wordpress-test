<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RLX social card</title>
	<style>
		@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wdth,wght@75..100,500..700&display=swap");
		* { box-sizing: border-box; }
		html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
		body {
			position: relative;
			display: grid;
			grid-template-columns: 1.35fr .65fr;
			background:
				linear-gradient(90deg, transparent 0 24.9%, rgba(255,255,255,.05) 25%, transparent 25.1% 49.9%, rgba(255,255,255,.05) 50%, transparent 50.1% 74.9%, rgba(255,255,255,.05) 75%, transparent 75.1%),
				#0b0e12;
			color: #f9fbf8;
			font-family: "Instrument Sans", Arial, sans-serif;
		}
		.logo {
			position: absolute;
			top: 34px;
			left: 40px;
			width: 104px;
		}
		.copy {
			align-self: end;
			padding: 0 44px 62px 40px;
		}
		.label {
			margin: 0 0 24px;
			color: #45c491;
			font-family: "IBM Plex Mono", monospace;
			font-size: 13px;
			letter-spacing: .08em;
			text-transform: uppercase;
		}
		h1 {
			max-width: 700px;
			margin: 0 0 28px;
			font-size: 84px;
			font-variation-settings: "wdth" 86;
			font-weight: 650;
			line-height: .9;
			letter-spacing: -.055em;
		}
		.sub {
			max-width: 610px;
			margin: 0;
			color: #c0c7c4;
			font-size: 22px;
			line-height: 1.4;
		}
		.visual {
			position: relative;
			align-self: center;
			width: 390px;
			height: 458px;
			margin-left: -28px;
			overflow: hidden;
			border: 1px solid rgba(69,196,145,.7);
			background: #12171d;
			box-shadow: 22px 22px 0 rgba(69,196,145,.08);
		}
		.visual img {
			width: 100%;
			height: 386px;
			object-fit: cover;
			object-position: center;
		}
		.note {
			display: flex;
			align-items: center;
			justify-content: space-between;
			height: 72px;
			padding: 0 16px;
			border-top: 1px solid rgba(255,255,255,.16);
			font-family: "IBM Plex Mono", monospace;
			font-size: 11px;
		}
		.note span:last-child { color: #a7b0ad; }
		.signal {
			position: absolute;
			right: 0;
			bottom: 28px;
			width: 33%;
			height: 1px;
			background: #45c491;
		}
	</style>
</head>
<body>
	<img class="logo" src="images/logo-white.png" alt="RLX">
	<div class="copy">
		<p class="label">Digital systems from Hong Kong</p>
		<h1>Built for business in motion.</h1>
		<p class="sub">Websites, products and identities designed and built by RLX.</p>
	</div>
	<div class="visual">
		<img src="images/one-source-screen.jpg" alt="">
		<div class="note"><span>1Source</span><span>Product platform</span></div>
	</div>
	<div class="signal"></div>
</body>
</html>
